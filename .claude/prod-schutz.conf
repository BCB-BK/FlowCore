# PROD-Schutz — Deklaration statt Raten (Kernvertrag §6, Standard v2.16)
#
# Diese Datei sagt dem PreToolUse-Guard, WAS in diesem Repo PROD ist. Alles, was
# hier nicht steht, gilt als DEV/Freigabestufe — dort arbeitet der Agent frei,
# ohne Nachfrage (Betreiber-Anordnung 10.09.2026).
#
# FAIL-CLOSED: Fehlt die Datei, gelten konservative Standardmuster (*prod*,
# *_prod, /var/www/*-prod). Wer nichts deklariert, bekommt die strengere Regel —
# nicht den Freibrief.
#
# Format: ART Wert          (ART: PFAD | DB | HOST | DIENST | KEINE)
#   PFAD   Verzeichnis, das PROD ausliefert. Schreibzugriffe darin sind gesperrt.
#   DB     Datenbankname der Produktion. Schreibendes SQL dagegen ist gesperrt.
#   HOST   Hostname/Adresse, die PROD ausliefert (für ssh/curl-Schreibpfade).
#   DIENST systemd-Unit ODER Container-Name, dessen Neustart PROD trifft. Beides
#          gehoert hier hin: `plato-prod.service` genauso wie `dwhp_webserver_prod`
#          — sonst laeuft `docker restart <container>` durch, weil der Name in
#          keinem anderen Muster vorkommt.
#   KEINE  Dieses Repo hat keine PROD-Umgebung (dann bleibt alles frei).
#
# LESEN IST IMMER FREI — auch hier. Der Guard sperrt ausschließlich Schreiben,
# Neustarten und Löschen. Analysen, Datenbankabfragen und Codelesen auf PROD
# brauchen keine Nachfrage (Betreiber-Anordnung 10.09.2026, Punkt 3).
#
# FREIGABE FÜR PROD-ARBEIT: Punkt 3.1 der Anordnung erlaubt Schreiben auf PROD
# auf ausdrückliche Anweisung. Weg: Datei .claude/ALLOW-PROD anlegen mit
# Auftrag und Datum in der ersten Zeile. Sie gilt für die laufende Sitzung, wird
# bei jedem Treffer protokolliert (.claude/prod-zugriffe.log) und ist nach der
# Aufgabe zu löschen.
#
# WAS DIESER SCHUTZ LEISTET — UND WAS NICHT: ALLOW-PROD und das Protokoll sind
# gitignored (Laufzeitartefakte, sonst käme jede Sitzung mit einem Diff daher).
# Sie sind damit NICHT im Diff sichtbar. Der Agent kann die Datei selbst anlegen
# — sie schützt den PROZESSSCHRITT, nicht gegen bösen Willen, genau wie der
# Wächter-Marker. Der belastbare Nachweis ist deshalb nicht die Datei, sondern
# der TAGESBERICHT: Jeder schreibende PROD-Zugriff gehört nach Kernvertrag §12
# in `berichte/<quelle>/<datum>-arbeit.md` — mit Auftrag, Anweisung und dem, was
# tatsächlich geändert wurde. Diese Datei hier (prod-schutz.conf) ist dagegen
# versioniert und reviewpflichtig wie Code (§10).
#
# Beispiele (auskommentiert — je Repo die echten Werte eintragen):
# PFAD   /var/www/plato-prod
# DB     plato_prod
# DIENST plato-prod.service
# HOST   plato.onecampusgroup.de
